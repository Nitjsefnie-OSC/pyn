# OSC fork CI wrapper - generated by scripts/make_wrapper.py;
# check with scripts/verify_wrapper.py before pushing.
# Jobs kept (verbatim, except the two sanctioned adaptations:
# checkout pinned to ${{ inputs.target_ref }}, and the inserted
# Provenance step):
#   - ci
#   - live
# DELIBERATELY EXCLUDED (loud):
#   - none

name: OSC batch mutant probe

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string
      mutants:
        description: 'JSON array of mutant refs (branches or SHAs) to probe'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-batch-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true
jobs:
  osc_provenance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
  ci:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ matrix.mutant }}
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt, clippy
    - name: Rust cache
      uses: swatinem/rust-cache@v2
    - name: Public boundary
      run: make boundary-check
    - name: Checks
      run: make check
    strategy:
      matrix:
        mutant: ${{ fromJSON(inputs.mutants) }}
      fail-fast: false
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pyn
          POSTGRES_PASSWORD: pyn
          POSTGRES_DB: pyn
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U pyn" --health-interval 5s --health-timeout
          5s --health-retries 10
    env:
      PYN_DATABASE_URL: postgres://pyn:pyn@localhost:5432/pyn
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ matrix.mutant }}
    - uses: dtolnay/rust-toolchain@stable
    - name: Rust cache
      uses: swatinem/rust-cache@v2
    - name: Tests that need Postgres
      run: cargo test --workspace -- --ignored
    - name: Mutant verdict (killed)
      if: failure()
      shell: bash
      run: |
        printf 'MUTANT %s: killed\n' "${{ matrix.mutant }}" | tee -a "$GITHUB_STEP_SUMMARY" "$GITHUB_WORKSPACE/osc-mutant-results.txt"
    - name: Mutant verdict (survived)
      if: success()
      shell: bash
      run: |
        printf 'MUTANT %s: survived\n' "${{ matrix.mutant }}" | tee -a "$GITHUB_STEP_SUMMARY" "$GITHUB_WORKSPACE/osc-mutant-results.txt"
    - name: Upload mutant results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mutant-results-${{ matrix.mutant }}
        path: ${{ github.workspace }}/osc-mutant-results.txt
    strategy:
      matrix:
        mutant: ${{ fromJSON(inputs.mutants) }}
      fail-fast: false
    continue-on-error: true
