# OSC fork CI wrapper - generated by scripts/make_wrapper.py;
# check with scripts/verify_wrapper.py before pushing.
# Jobs kept (verbatim, except the two sanctioned adaptations:
# checkout pinned to ${{ inputs.target_ref }}, and the inserted
# Provenance step):
#   - fmt-docs
#   - clippy
#   - test
#   - ci [no checkout step - no Provenance step added, none invented] [keeps its own if: (always()) - evaluated as written on workflow_dispatch too]
#   - live
# DELIBERATELY EXCLUDED (loud):
#   - docker: not in the keep list

name: OSC manual CI

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: 'Git branch, tag, or 40-character commit SHA to validate'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: osc-manual-${{ github.repository }}-${{ inputs.target_ref }}
  cancel-in-progress: true
env:
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  NEXTEST_PROFILE: ci
jobs:
  fmt-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: rustfmt
    - name: Format, docs links and public boundary
      run: make fmt-check docs-check boundary-check
  clippy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        shared-key: lint
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - name: Clippy
      run: make clippy
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
        - 1
        - 2
        - 3
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: dtolnay/rust-toolchain@stable
    - name: Pinned git
      uses: ./.github/actions/setup-git
    - name: Git version
      run: git --version
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        shared-key: test
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest
    - name: Tests
      run: make test NEXTEST_ARGS="--partition hash:${{ matrix.shard }}/3"
  ci:
    if: always()
    needs:
    - fmt-docs
    - clippy
    - test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
    - name: All jobs succeeded
      run: test "${{ needs.fmt-docs.result }}${{ needs.clippy.result }}${{ needs.test.result
        }}" = successsuccesssuccess
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pyn
          POSTGRES_PASSWORD: pyn
          POSTGRES_DB: pyn
        ports:
        - 5432:5432
        options: --health-cmd "pg_isready -U pyn" --health-interval 5s --health-timeout
          5s --health-retries 10
    env:
      PYN_DATABASE_URL: postgres://pyn:pyn@localhost:5432/pyn
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        ref: ${{ inputs.target_ref }}
    - name: Provenance
      shell: bash
      run: |
        set -euo pipefail
        echo "tested_target_ref=${{ inputs.target_ref }}"
        checked_out_sha="$(git rev-parse HEAD)"
        if [[ ! "$checked_out_sha" =~ ^[0-9a-f]{40}$ ]]; then
          echo "::error::git rev-parse HEAD did not produce a 40-character commit SHA: $checked_out_sha"
          exit 1
        fi
        printf 'checked-out SHA: %s\n' "$checked_out_sha"
    - uses: dtolnay/rust-toolchain@stable
    - name: Pinned git
      uses: ./.github/actions/setup-git
    - name: Git version
      run: git --version
    - name: Rust cache
      uses: swatinem/rust-cache@v2
      with:
        shared-key: test
        save-if: ${{ github.ref == 'refs/heads/main' }}
    - uses: taiki-e/install-action@v2
      with:
        tool: nextest
    - name: Tests that need Postgres
      run: make test-live
